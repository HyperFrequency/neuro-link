# Ray cluster config for neuro-link + nautilus + optuna sweeps
# Bring up:    ray up pkg/cloud/ray/cluster.yaml --yes
# Submit job:  RAY_ADDRESS=http://$HEAD:8265 ray job submit --working-dir . -- python pkg/cloud/ray/job.py

cluster_name: nlr-sweeps
max_workers: 8
upscaling_speed: 1.0
idle_timeout_minutes: 15

docker:
  image: "rayproject/ray-ml:2.55.0-gpu"
  container_name: "ray-nlr"
  pull_before_run: true
  run_options:
    - "--shm-size=16g"
    - "--ulimit nofile=65536:65536"

provider:
  type: aws
  region: us-west-2
  availability_zone: us-west-2a,us-west-2b,us-west-2c
  cache_stopped_nodes: false

available_node_types:
  ray.head:
    resources: {CPU: 4}
    node_config:
      InstanceType: m6i.xlarge
      ImageId: latest_dlami
  ray.worker.gpu:
    min_workers: 0
    max_workers: 8
    resources: {CPU: 8, GPU: 1}
    node_config:
      InstanceType: g5.2xlarge
      ImageId: latest_dlami

head_node_type: ray.head

initialization_commands:
  - sudo usermod -aG docker $USER

setup_commands:
  - pip install -U "ray[default,tune]==2.55.0" optuna==4.8.0 nautilus-trader==1.225.0
  - mkdir -p ~/.cache/qmd/models ~/models
  - huggingface-cli download mradermacher/Octen-Embedding-8B-GGUF Octen-Embedding-8B.Q8_0.gguf --local-dir ~/models --local-dir-use-symlinks False
  - huggingface-cli download ggml-org/Qwen3-Reranker-0.6B-Q8_0-GGUF qwen3-reranker-0.6b-q8_0.gguf --local-dir ~/.cache/qmd/models --local-dir-use-symlinks False
  - huggingface-cli download tobil/qmd-query-expansion-1.7B-gguf qmd-query-expansion-1.7B-q4_k_m.gguf --local-dir ~/.cache/qmd/models --local-dir-use-symlinks False

head_start_ray_commands:
  - ray stop
  - ulimit -n 65536; ray start --head --port=6379 --object-manager-port=8076 --dashboard-host=0.0.0.0 --dashboard-port=8265 --autoscaling-config=~/ray_bootstrap_config.yaml

worker_start_ray_commands:
  - ray stop
  - ulimit -n 65536; ray start --address=$RAY_HEAD_IP:6379 --object-manager-port=8076

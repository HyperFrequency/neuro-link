# neuro-link docker compose — dev profile (default) and prod profile
# No `version:` key — Compose v2 ignores it.

x-nlr-env: &nlr-env
  NLR_ROOT: /app
  NLR_MODELS_DIR: /app/models
  QMD_CACHE_DIR: /root/.cache/qmd/models
  DEEP_TOOL_WIKI_DIR: /app/deep-tool-wiki
  LLM_WIKI_DIR: /app/02-KB-main

services:
  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports: ["6333:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Gate-9 Y2: moved to `full` profile so `docker compose` (default) and
  # `--profile rag` don't require NEO4J_PASSWORD at parse time — lets
  # the minimum RAG setup boot from a clean clone without any secrets.
  # Graph-ontology workloads opt in via `--profile full`.
  neo4j:
    image: neo4j:5.23-community
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
      NEO4J_PLUGINS: '["apoc"]'
    volumes: ["neo4j-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    profiles: ["full"]

  # Gate-9 Y2: moved to `full` profile — same reasoning as neo4j. The RAG
  # retrieval path doesn't invoke the LiteLLM proxy; only the full
  # deployment does.
  litellm-proxy:
    build: { context: ../.., dockerfile: pkg/docker/Dockerfile.litellm }
    ports: ["4000:4000"]
    environment:
      <<: *nlr-env
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:?}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:?}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    depends_on: { qdrant: { condition: service_healthy } }
    profiles: ["full"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ingest:
    build: { context: ../.., dockerfile: pkg/docker/Dockerfile.ingest }
    environment:
      <<: *nlr-env
    volumes:
      - ../../..:/app:ro
      - models-cache:/app/models
      - qmd-cache:/root/.cache/qmd
    depends_on:
      qdrant: { condition: service_healthy }
      neo4j: { condition: service_healthy }
    profiles: ["ingest"]

  # Warm llama.cpp server for the Octen-8B embedder. Mirrors the host's
  # PID 57419 pattern (--embeddings mode, 4096-dim vectors). nlr_wiki
  # qdrant collection (4096-dim) is built from THIS embedder.
  llama-embed:
    image: ghcr.io/ggml-org/llama.cpp:server
    # OCTEN_VARIANT + NLR_MODELS_DIR are loaded from the manifest written
    # by download_models.sh — single source of truth. If the manifest is
    # missing (i.e. `make models` hasn't run), compose fails to parse
    # this service, surfacing the real prerequisite instead of starting
    # llama-embed against a non-existent file.
    # Default NLR_MODELS_DIR (../../models) resolves relative to this
    # compose file: pkg/docker/../../models = <neuro-link repo root>/models
    # — the exact path download_models.sh writes to when invoked with the
    # same unset env. That keeps the download artifact and the serve
    # mount aligned without relying on a shared shell env. Override by
    # exporting NLR_MODELS_DIR=/abs/path before BOTH `make models` and
    # `docker compose up`.
    env_file:
      - ${NLR_MODELS_DIR:-../../models}/.octen-manifest.env
    command: >
      --embeddings
      --model /models/Octen-Embedding-8B.${OCTEN_VARIANT:-f16}.gguf
      --port 8400 --host 0.0.0.0
      --ctx-size 4096 --batch-size 512 --threads 8 --no-warmup
    ports: ["8400:8400"]
    volumes:
      - ${NLR_MODELS_DIR:-../../models}:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -w '%{http_code}' http://localhost:8400/health | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    profiles: ["rag", "full"]

  # Warm llama.cpp server for the Qwen3-Reranker cross-encoder.
  # qmd 0.1.2 does NOT call it out of the box — this is the target for the
  # server-side rerank path (R+2 P5 rag.rs: hit :8401 after qmd's initial top-K).
  llama-rerank:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >
      --reranking
      --model /models/qwen3-reranker-0.6b-q8_0.gguf
      --port 8401 --host 0.0.0.0
      --ctx-size 2048 --threads 4 --no-warmup
    ports: ["8401:8401"]
    volumes:
      - ${QMD_CACHE_DIR:-~/.cache/qmd/models}:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -w '%{http_code}' http://localhost:8401/health | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    profiles: ["rag", "full"]

  # Warm llama.cpp server for the qmd query-expansion 1.7B model.
  # Serves as a text-completion endpoint — neuro-link's retrieval path calls
  # this once per query to get 3-5 paraphrased sub-queries, then runs them
  # in parallel against qdrant.
  llama-qexpand:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >
      --model /models/qmd-query-expansion-1.7B-q4_k_m.gguf
      --port 8402 --host 0.0.0.0
      --ctx-size 2048 --threads 4 --no-warmup
    ports: ["8402:8402"]
    volumes:
      - ${QMD_CACHE_DIR:-~/.cache/qmd/models}:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -w '%{http_code}' http://localhost:8402/health | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    profiles: ["rag", "full"]

  optuna-dashboard:
    image: python:3.12-slim
    command: >
      bash -c "pip install --quiet optuna optuna-dashboard &&
               optuna-dashboard --host 0.0.0.0 --port 8080 sqlite:////studies/optuna.db"
    ports: ["8080:8080"]
    volumes: ["optuna-studies:/studies"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  vbtpro-dashboard:
    build: { context: ../.., dockerfile: pkg/docker/Dockerfile.vbtpro }
    ports: ["8501:8501"]
    environment:
      <<: *nlr-env
    profiles: ["dashboards"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  qdrant-data:
  neo4j-data:
  models-cache:
  qmd-cache:
  optuna-studies:

[project]
name = "neuro-link-pkg-tooling"
version = "0.2.0"
description = "Python tooling that ships with neuro-link installers (model download, dashboards, first-run bootstrap)"
# 3.12+ required because qmd transitively pulls torch, and on Apple Silicon
# the uv-managed cpython-3.11 is x86_64 (see pkg/README.md §arm64-python-trap).
# x86_64 interpreter → torch 2.2.2 (last x86_64 macOS build) → numpy conflict
# → qmd import crash. 3.12 has native arm64 wheels at uv.
requires-python = ">=3.12"
dependencies = [
    # Model fetching (first-run bootstrap)
    "huggingface-hub>=0.28.0",
    # RAG retrieval sidecar — BM25 + vector + rerank + query-expand
    # Uses the three GGUF models downloaded by scripts/download_models.sh.
    # Neuro-link Rust server will call `qmd search` as a subprocess per
    # deep-tool-wiki/qmd/code.md §2 (server/src/rag.rs — WIP in R+2 P5).
    #
    # NOTE: qmd 0.1.2's default embedder is Qwen3-Embedding-0.6B (1024-dim).
    # neuro-link's nlr_wiki qdrant collection is Octen-8B 4096-dim. Before
    # wiring qmd to nlr_wiki, resolve the dim mismatch (R+2 P4).
    "qmd>=0.1.2",
    # Dashboards referenced in pkg/README.md
    "optuna>=4.0.0",
    "optuna-dashboard>=0.16.0",
    "plotly>=5.24.0",
    "dash>=2.18.0",
    # Aggregate-proof + setup-script tooling
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Harness-side (tree-sitter grading, LSP callsite verification, ontology-gap seeding).
# Installed into $RUN_ROOT/harness-venv per the batch-create-eval driver.
harness = [
    "tree-sitter>=0.24",
    "tree-sitter-python>=0.25",
    "tree-sitter-rust>=0.24",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-typescript>=0.23",
]

dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
# Resolution strategy: lowest-compatible for reproducible fresh-clone builds.
# Override per-target in CI via `uv sync --resolution=highest`.
resolution = "lowest-direct"
